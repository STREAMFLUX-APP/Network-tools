const apiAuth=async(body)=>{try{const r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return r.json();}catch(e){return{error:e.message};}};
const apiClaude=async(prompt,maxTokens=1000)=>{
const r=await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,maxTokens})});
const d=await r.json();
if(d.error)throw new Error(d.error);
return d.text||"";
};

const btnStyle=(disabled,bg)=>({background:disabled?"#e8e6f0":bg||G.dark,color:disabled?G.muted:"#fff",border:"none",borderRadius:"10px",padding:"13px 24px",fontSize:"14px",fontWeight:"700",cursor:disabled?"not-allowed":"pointer",fontFamily:"inherit"});
const inputStyle={width:"100%",background:G.gbg,border:`1.5px solid ${G.gl}`,borderRadius:"9px",color:"#111",fontSize:"14px",padding:"11px 14px",outline:"none",fontFamily:"inherit",boxSizing:"border-box"};

const labelStyle={display:"block",fontSize:"11px",fontWeight:"700",letterSpacing:"0.08em",color:G.muted,textTransform:"uppercase",marginBottom:"4px"};

function el(tag,attrs,...children){
const e=document.createElement(tag);
if(attrs)Object.entries(attrs).forEach(([k,v])=>{
if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
else if(k==="class")e.className=v;
else e.setAttribute(k,v);
});
children.flat().forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});
return e;
}

function field(label,type,value,onChange,placeholder,hint){
const wrap=el("div",{style:{marginBottom:"14px"}});
if(label)wrap.appendChild(el("label",{style:labelStyle},label));
if(hint)wrap.appendChild(el("p",{style:{fontSize:"11px",color:"#999",margin:"0 0 4px",fontStyle:"italic"}},hint));
const inp=el("input",{type:type||"text",placeholder:placeholder||"",style:inputStyle});
inp.value=value||"";
inp.addEventListener("input",e=>onChange(e.target.value));
wrap.appendChild(inp);
return wrap;
}

function textarea(label,value,onChange,placeholder,rows,hint){
const wrap=el("div",{style:{marginBottom:"14px"}});
if(label)wrap.appendChild(el("label",{style:labelStyle},label));
if(hint)wrap.appendChild(el("p",{style:{fontSize:"11px",color:"#999",margin:"0 0 4px",fontStyle:"italic"}},hint));
const ta=el("textarea",{placeholder:placeholder||"",rows:rows||3,style:{...inputStyle,resize:"vertical"}});
ta.value=value||"";
ta.addEventListener("input",e=>onChange(e.target.value));
wrap.appendChild(ta);
return wrap;
}

function chips(label,hint,options,selected,onToggle,single){
const wrap=el("div",{style:{marginBottom:"18px"}});
if(label)wrap.appendChild(el("label",{style:labelStyle},label));
if(hint)wrap.appendChild(el("p",{style:{fontSize:"11px",color:"#999",margin:"0 0 6px",fontStyle:"italic"}},hint));
const grid=el("div",{style:{display:"flex",flexWrap:"wrap",gap:"7px"}});
options.forEach(opt=>{
const val=typeof opt==="string"?opt:opt.value;
const lbl=typeof opt==="string"?opt:opt.label;
const sub=typeof opt==="object"?opt.desc:null;
const active=single?selected===val:(selected||[]).includes(val);
const btn=el("button",{style:{background:active?G.dark:G.gbg,border:`1.5px solid ${active?G.dark:G.gl}`,borderRadius:"9px",color:active?"#fff":"#555",fontSize:"12px",padding:sub?"9px 13px":"7px 12px",cursor:"pointer",fontFamily:"inherit",textAlign:"left",transition:"all 0.15s"}},
el("div",{style:{fontWeight:active?"700":"400"}},lbl),
...(sub?[el("div",{style:{fontSize:"11px",color:active?"#b8aff0":G.muted,marginTop:"2px"}},sub)]:[])
);
btn.addEventListener("click",()=>onToggle(val));
grid.appendChild(btn);
});
wrap.appendChild(grid);
return wrap;
}

function copyCard(title,content){
const card=el("div",{style:{background:G.gbg,border:`1px solid ${G.border}`,borderRadius:"12px",padding:"14px 16px",marginBottom:"11px"}});
const copyBtn=el("button",{style:{background:G.card,border:`1px solid ${G.gl}`,borderRadius:"6px",color:G.muted,fontSize:"11px",padding:"4px 11px",cursor:"pointer",fontFamily:"inherit",flexShrink:"0"}},"Copy");
copyBtn.addEventListener("click",()=>{
navigator.clipboard.writeText(content||"");
copyBtn.textContent="✓ Copied";copyBtn.style.color=G.green;copyBtn.style.borderColor=G.green;
setTimeout(()=>{copyBtn.textContent="Copy";copyBtn.style.color=G.muted;copyBtn.style.borderColor=G.gl;},1800);
});
card.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"9px"}},
el("span",{style:{fontSize:"11px",fontWeight:"700",letterSpacing:"0.08em",color:G.dark,textTransform:"uppercase"}},title),
copyBtn
));
card.appendChild(el("p",{style:{color:"#111",fontSize:"13px",lineHeight:"1.8",margin:"0",whiteSpace:"pre-wrap"}},content||""));
return card;
}

function renderLogin(){
let email="",password="",loading=false;
const wrap=el("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",background:G.bg}});
const inner=el("div",{style:{width:"100%",maxWidth:"400px"}});
inner.appendChild(el("div",{style:{textAlign:"center",marginBottom:"28px"}},
el("div",{style:{width:"52px",height:"52px",borderRadius:"13px",background:G.dark,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"24px",color:"#fff",margin:"0 auto 12px"}},"✦"),
el("div",{style:{fontSize:"20px",fontWeight:"bold",letterSpacing:"2px"}},"Network Tools"),
el("div",{style:{fontSize:"12px",color:G.muted,marginTop:"2px"}},"by Streamflux")
));
const card=el("div",{style:cardStyle});
card.appendChild(el("h2",{style:{fontSize:"17px",fontWeight:"700",marginBottom:"4px"}},tt(appLang).loginTitle));
card.appendChild(el("p",{style:{fontSize:"13px",color:G.muted,marginBottom:"20px"}},tt(appLang).loginSub));
const emailInp=el("input",{type:"email",placeholder:"your@email.com",style:{...inputStyle,marginBottom:"12px"}});
const passInp=el("input",{type:"password",placeholder:"••••••••",style:{...inputStyle,marginBottom:"16px"}});
emailInp.addEventListener("input",e=>email=e.target.value);
passInp.addEventListener("input",e=>password=e.target.value);
const errDiv=el("div",{style:{background:"#fff5f5",border:"1px solid #fecaca",borderRadius:"8px",padding:"9px 12px",color:G.red,fontSize:"13px",marginBottom:"12px",display:"none"}});
const loginBtn=el("button",{style:{...btnStyle(false),width:"100%",fontSize:"15px"}},tt(appLang).loginBtn);
const doLogin=async()=>{
if(!email||!password){errDiv.textContent=tt(appLang).loginErr;errDiv.style.display="block";return;}
loginBtn.textContent=tt(appLang).loggingIn;loginBtn.disabled=true;loginBtn.style.background="#e8e6f0";loginBtn.style.color=G.muted;
errDiv.style.display="none";
const res=await apiAuth({action:"login",email,password});
if(res.success){localStorage.setItem("nt_u",JSON.stringify(res.user));setState({screen:"dashboard",user:res.user});}
else{errDiv.textContent="⚠ "+(res.error||"Login failed.");errDiv.style.display="block";loginBtn.textContent=tt(appLang).loginBtn;loginBtn.disabled=false;loginBtn.style.background=G.dark;loginBtn.style.color="#fff";}
};
loginBtn.addEventListener("click",doLogin);
passInp.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
card.appendChild(el("label",{style:labelStyle},tt(appLang).loginEmail));
card.appendChild(emailInp);
card.appendChild(el("label",{style:labelStyle},tt(appLang).loginPass));
card.appendChild(passInp);
card.appendChild(errDiv);
card.appendChild(loginBtn);
card.appendChild(el("p",{style:{textAlign:"center",color:G.muted,fontSize:"11px",marginTop:"14px"}},tt(appLang).loginHelp,el("span",{style:{color:G.purple}},"support@streamflux.app")));
inner.appendChild(card);
wrap.appendChild(inner);
return wrap;
}

function dkTextarea(label,value,onChange,placeholder,rows,hint){

return wrap;
}

// ── MAIN RENDER ─────────────────────────────────────────────────────────────
function render(){
const root=document.getElementById("root");
root.innerHTML="";
if(state.screen==="login")root.appendChild(renderLogin());
else if(state.screen==="dashboard")root.appendChild(renderDashboard());
else if(state.screen==="app1")root.appendChild(renderApp1());
else if(state.screen==="app2")root.appendChild(renderApp2());
}

// ── INIT ─────────────────────────────────────────────────────────────────────
// Always show login immediately, then check session
render();
var saved=localStorage.getItem("nt_u");
if(saved){
try{
var u=JSON.parse(saved);
apiAuth({action:"check",userId:u.id}).then(function(res){
if(res&&res.success){state={screen:"dashboard",user:res.user};render();}
else{localStorage.removeItem("nt_u");}
}).catch(function(){localStorage.removeItem("nt_u");});
}catch(e){localStorage.removeItem("nt_u");}
}
