[script]\n\nVERSION B:\n[script]\n\nSHARED:\n[audio, thumbnail, caption]\n\nWrite ONLY the scripts and shared elements:`,fb_feed:(b)=>`${b}\n\nWrite TWO Facebook FEED POSTS in ${lang}. 150-200 words each. ONE story per version. End with question. CTA + link: ${profile.link}. 2-3 emojis. Real person feel.\nVersion A: personal story.\nVersion B: conversational "Have you ever..."\n\nVERSION A:\n[post]\n\nVERSION B:\n[post]\n\nWrite ONLY the two posts:`,fb_shop:(b)=>`${b}\n\nWrite TWO Facebook SHOP POSTS in ${lang}. ONE benefit focus. 100-130 words each. Punchy headline. 3 bullet points with ✓. "Shop Now" + link: ${profile.link}.\nVersion A: focus on result.\nVersion B: focus on solving the pain.\nThen 12 hashtags.\n\nVERSION A:\n[post]\n\nVERSION B:\n[post]\n\nHASHTAGS:\n[hashtags]\n\nWrite ONLY posts and hashtags:`,tiktok_shop:(b)=>`${b}\n\nWrite TWO TikTok SHOP scripts in ${lang} (35-45 sec). 100% native TikTok feel. ONE hook, ONE problem, ONE product, ONE result.\nVersion A: reaction/surprise hook.\nVersion B: direct address hook.\n\nFor each:\nHOOK (0-3s):\nPROBLEM (3-8s):\nPRODUCT REVEAL (8-20s):\nTRANSFORMATION (20-35s):\nSHOP CTA (35-45s): [${profile.name} — ${profile.link}]\n\nThen once: Product tag moment, Pinned comment, Caption + hashtags, Audio mood.\n\nVERSION A:\n[script]\n\nVERSION B:\n[script]\n\nSHARED:\n[extras]\n\nWrite ONLY the scripts and shared elements:`,image:(b)=>`${b}\n\nCreate a complete IMAGE CONTENT PACKAGE in ${lang}${selProds.length>0?" for "+selProds.map(p=>p.label).join(", "):""}. ONE hair problem focus only.\n\nIMAGE PROMPT 1 — HAIR TRANSFORMATION (paste into ChatGPT or Midjourney):\nUltra-detailed AI image prompt of a real woman showing the RESULT. No product bottle. Show gorgeous hair, emotion, confidence. Include: hair texture, skin tone, expression, lighting (soft natural or studio), background (clean white or blurred), camera angle, photography style (editorial beauty, hyperrealistic, 8K). One detailed paragraph ready to paste.\n\ const OUT_TABS=[{id:"messages",label:"💬 WhatsApp & SMS"},{id:"voice",label:"🎙️ Voice Script"},{id:"email",label:"📧 Email"},{id:"letter",label:"✉️ Formal Letter"},{id:"followups",label:"🔄 Follow-Ups"},{id:"schedule",label:"📅 Schedule"}];

function OChip({label,desc,active,onClick}){return <button onClick={onClick} style={{padding:desc?"9px 13px":"7px 12px",borderRadius:7,cursor:"pointer",textAlign:"left",background:active?"#1a1a2e":"#0d1017",border:`1px solid ${active?G.purple:G.border}`,color:active?"#b8aff0":"#9ca3af",fontSize:12}}><div style={{fontWeight:active?700:400}}>{label}</div>{desc&&<div style={{fontSize:11,color:active?"#7664d0":G.muted,marginTop:2}}>{desc}</div>}</button>;}
function OChips({label,hint,opts,sel,toggle,single=false}){return <div style={{marginBottom:16}}><label style={{display:"block",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:G.muted,textTransform:"uppercase",marginBottom:3}}>{label}</label>{hint&&<p style={{fontSize:11,color:"#4b5563",margin:"0 0 5px",fontStyle:"italic"}}>{hint}</p>}<div style={{display:"flex",flexWrap:"wrap",gap:7}}>{opts.map(o=>{const v=typeof o==="string"?o:o.value,l=typeof o==="string"?o:o.label,d=typeof o==="object"?o.desc:null,active=single?sel===v:(Array.isArray(sel)&&sel.includes(v));return <OChip key={v} label={l} desc={d} active={active} onClick={()=>toggle(v)}/>;})}</div></div>;}
function OField({label,hint,value,onChange,placeholder,type="text",rows}){const s={width:"100%",background:"#0d1017",border:`1px solid ${G.border}`,borderRadius:8,color:G.text,fontSize:14,padding:"11px 14px",outline:"none",boxSizing:"border-box",fontFamily:"inherit"};return <div style={{marginBottom:16}}><label style={{display:"block",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:G.muted,textTransform:"uppercase",marginBottom:3}}>{label}</label>{hint&&<p style={{fontSize:11,color:"#4b5563",margin:"0 0 5px",fontStyle:"italic"}}>{hint}</p>}{rows?<textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows} style={{...s,resize:"vertical"}}/>:<input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={s}/>}</div>;}
function OCard({title,content,badge}){const[cp,setCp]=useState(false);if(!content)return null;return <div style={{background:"#0d1017",border:`1px solid ${G.border}`,borderRadius:10,padding:"15px 17px",marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:9}}><div style={{display:"flex",alignItems:"center",gap:7}}><span style={{fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:G.purple,textTransform:"uppercase"}}>{title}</span>{badge&&<span style={{fontSize:10,background:"#1a1a2e",color:"#7664d0",border:"1px solid #2e2a4a",borderRadius:4,padding:"2px 7px"}}>{badge}</span>}</div><button onClick={()=>{navigator.clipboard.writeText(content);setCp(true);setTimeout(()=>setCp(false),1800);}} style={{background:cp?"#1a2a1a":"#13161b",border:`1px solid ${cp?"#2a5a2a":G.border}`,borderRadius:6,color:cp?"#4caf50":"#9ca3af",fontSize:11,padding:"4px 12px",cursor:"pointer"}}>{cp?"✓ Copied":"Copy"}</button></div><p style={{color:"#d1d5db",fontSize:14,lineHeight:1.75,margin:0,whiteSpace:"pre-wrap"}}>{content}</p></div>;}

function OutreachMachine({user,lang,onBack}){
const[loading,setLoading]=useState(false),[loadingMsg,setLoadingMsg]=useState(""),[result,setResult]=useState(null),[error,setError]=useState(""),[tab,setTab]=useState("messages");
const[contactType,setContactType]=useState(""),[contactReason,setContactReason]=useState(""),[tone,setTone]=useState(""),[objection,setObjection]=useState(""),[exactObjection,setExactObjection]=useState("");
const[contactName,setContactName]=useState(""),[hairProblems,setHairProblems]=useState([]),[products,setProducts]=useState([]),[partnerTargets,setPartnerTargets]=useState([]),[priorContact,setPriorContact]=useState(""),[personalNote,setPersonalNote]=useState("");
const[yourName,setYourName]=useState(user.name||""),[yourPhone,setYourPhone]=useState(""),[yourLink,setYourLink]=useState("");
const isPartner=contactType==="potential_partner"||contactType==="past_partner";
const isObjection=contactReason==="handle_objection";
const canGenerate=contactName&&contactType&&contactReason&&tone&&yourName;
const langLabel=lang==="Mexican"?"Mexican Spanish (use Mexican expressions, phrases natural to Mexico — not Spain Spanish)":lang;
const langNote=lang!=="English"?`\n\nCRITICAL: Write ALL content in ${langLabel}. Every single word must be in that language.`:"";
const ctx=`CONTACT:\n- Name: ${contactName}\n- Type: ${OUT_CONTACT_TYPES.find(t=>t.value===contactType)?.label||contactType}\n- Reason: ${OUT_REASONS.find(r=>r.value===contactReason)?.label||contactReason}\n- Tone: ${OUT_TONES.find(t=>t.value===tone)?.label||tone}\n- Prior contact: ${priorContact||"none"}\n- Personal note: ${personalNote||"none"}${isObjection?`\n- Objection category: ${OUT_OBJECTIONS.find(o=>o.value===objection)?.label||objection}${exactObjection?`\n- Their exact words: "${exactObjection}"`:""}`:""}\n${hairProblems.length>0?`- Hair/skin problems: ${hairProblems.join(", ")}`:""}${products.length>0?`\n- Products to promote: ${products.join(", ")}`:""}${isPartner&&partnerTargets.length>0?`\n- Why they'd be a good partner: ${partnerTargets.join(", ")}`:""}SENDER (Market Partner): ${yourName}${yourPhone?" | "+yourPhone:""}${yourLink?" | "+yourLink:""}\nMONAT: "We Are Modern Nature" | #1 Direct Seller Premium Haircare | $3.4B+ revenue | 100+ millionaires | 17 countries | Leaping Bunny certified | Made in USA | Top 5 haircare on TikTok Shop${isPartner?"\nPARTNER OPPORTUNITY: Earn up to 5x/month | $1.5B+ paid | Work from home | Be your own boss | Community of winners":""}`;
const generate=async()=>{
setError("");setLoading(true);setResult(null);
try{
setLoadingMsg("✦ Writing messages & voice script...");
let p1;
if(isObjection){p1=`You are an elite MONAT network marketing coach. Write objection-handling responses.\n\n${ctx}${langNote}\n\nReturn ONLY raw JSON (no markdown):\n{\n"whatsapp": "60-80 words. ${exactObjection?`Respond directly to these exact words: ${exactObjection}.`:"Acknowledge their concern genuinely."} Reframe positively. Soft question at end. Never pushy.",\n"sms": "Max 160 chars. Warm, understanding.",\n"voice_script": "Phone script. OPENING: acknowledge their position warmly. EMPATHY: understand their concern. REFRAME: new perspective or MONAT fact. QUESTION: one soft discovery question. CLOSE: low-commitment next step. Label each section.",\n"email_subject": "Under 9 words. Doesn't feel like sales.",\n"email_body": "140-160 words. Handle objection gracefully. Acknowledge, provide value, keep relationship. Signed by ${yourName}."\n}`;}
else{p1=`You are an elite MONAT network marketing coach. Write personalised outreach messages.\n\n${ctx}${langNote}\n\nReturn ONLY raw JSON (no markdown):\n{\n"whatsapp": "60-90 words. Warm, personal, use ${contactName}'s name. Reference their specific situation. Build curiosity naturally. ONE easy question at end. Never salesy. Real friend feel.",\n"sms": "Max 160 chars. Punchy and personal. ${contactName}'s name. Soft CTA.",\n"voice_script": "Phone script. OPENING: greet ${contactName} warmly. REASON: why calling specifically for them. VALUE: what's in it for them. CLOSE: one specific low-commitment next step. Label each section. Natural spoken language.",\n"email_subject": "Personal, curiosity-driving. Under 10 words.",\n"email_body": "140-170 words. Personal opener about their situation. Value for them. CTA. Signed ${yourName}${yourLink?" | "+yourLink:""}."\n}`;}
const part1=await callClaudeJSON(p1,1300);
setLoadingMsg("✦ Writing letter & follow-ups...");
const p2=`You are an elite MONAT network marketing coach.\n\n${ctx}${langNote}\n\nReturn ONLY raw JSON (no markdown):\n{\n"formal_letter": "Full formal letter. Format:\\n[Date]\\n\\n${contactName}\\n[Their Address]\\n\\nDear ${contactName},\\n\\nParagraph 1: warm personal opening.\\nParagraph 2: the specific opportunity or product for their situation.\\nParagraph 3: why now.\\nParagraph 4: warm close with clear next step.\\n\\nWarm regards,\\n${yourName}${yourPhone?"\\n"+yourPhone:""}${yourLink?"\\n"+yourLink:""}. 260-300 words.",\n"followup_1": "Day 3 — no reply. 50-65 words. Friendly nudge. Different angle. Easy question.",\n"followup_2": "Week 1 — no reply. 50-65 words. New angle or MONAT fact. Light urgency.",\n"followup_3": "Week 2 — no reply. 40-55 words. Casual. Zero pressure. Keep door open.",\n"followup_4": "Month 1 — no reply. 40-50 words. Final warm touch. No pressure."\n}`;
const part2=await callClaudeJSON(p2,1400);
setLoadingMsg("✦ Building follow-up schedule...");
const p3=`MONAT network marketing coach. Create a 7-day follow-up schedule.\nCONTACT: ${contactName} | TYPE: ${OUT_CONTACT_TYPES.find(t=>t.value===contactType)?.label} | REASON: ${OUT_REASONS.find(r=>r.value===contactReason)?.label}${langNote}\n\nReturn ONLY raw JSON:\n{"schedule":[{"day":"Today — First Contact","icon":"🚀","tasks":["Send the WhatsApp message","If no reply after 3 hours, send the SMS","Note the contact with today's date"]},{"day":"Day 3 — First Follow-Up","icon":"💬","tasks":["Send Follow-Up #1 if no reply","Check if they viewed your message","Note their response or silence"]},{"day":"Day 7 — Week 1 Check-In","icon":"📞","tasks":["Send Follow-Up #2 with a fresh angle","Make a phone call using your voice script","Listen first — ask questions before anything"]},{"day":"Day 14 — Two Week Touch","icon":"🔄","tasks":["Send Follow-Up #3 — casual, zero pressure","Share a relevant result or before/after","Update your records"]},{"day":"Day 30 — Monthly Touch","icon":"🌱","tasks":["Send Follow-Up #4 — final warm message","If still no reply, add to monthly check-in list","Timing is everything — stay patient"]},{"day":"Ongoing — Stay Top of Mind","icon":"📅","tasks":["Share occasional MONAT results on WhatsApp Status","Check in every 90 days","Life situations change — keep the door open"]}]}`;
const part3=await callClaudeJSON(p3,900);
setResult({...part1,...part2,...part3});setTab("messages");
}catch(e){setError("Error: "+e.message);}
setLoading(false);setLoadingMsg("");
};
const ocard={background:G.card,border:`1px solid ${G.border}`,borderRadius:14,padding:"22px",marginBottom:16};
const btnOP=(d)=>({background:d?"#1a1a2e":G.purple,color:d?G.muted:"#fff",border:"none",borderRadius:10,padding:"13px 22px",fontSize:14,fontWeight:700,cursor:d?"not-allowed":"pointer"});
const btnOS={background:"transparent",color:G.muted,border:`1px solid ${G.border}`,borderRadius:10,padding:"13px 22px",fontSize:14,cursor:"pointer"};
const OHdr=()=><header style={{background:G.card,borderBottom:`1px solid ${G.border}`,padding:"0 18px",height:54,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}><div style={{display:"flex",alignItems:"center",gap:9}}><button onClick={onBack} style={{...btnOS,padding:"4px 10px",fontSize:11}}>← Home</button><div style={{width:30,height:30,borderRadius:8,background:G.purpleDim,border:`1px solid ${G.purple}`,display:"flex",alignItems:"center",justifyContent:"center",color:"#b8aff0",fontSize:13}}>🤝</div><div><div style={{fontSize:13,fontWeight:"bold",letterSpacing:2,color:G.text}}>Outreach Machine</div><div style={{fontSize:8,color:G.purple,letterSpacing:2,textTransform:"uppercase"}}>by Streamflux</div></div></div><div style={{display:"flex",alignItems:"center",gap:7}}>{user.trialActive&&<span style={{fontSize:10,color:G.purple,background:G.purpleDim,borderRadius:10,padding:"3px 8px"}}>⏰ {user.daysLeft}d left</span>}<span style={{fontSize:10,color:G.purple,background:G.purpleDim,borderRadius:10,padding:"3px 8px"}}>{lang}</span></div></header>;
if(result)return <div style={{minHeight:"100vh",background:G.bg,color:G.text}}><OHdr/><div style={{maxWidth:720,margin:"0 auto",padding:"20px 14px 60px"}}><div style={{background:G.purpleDim,border:`1px solid ${G.purple}`,borderRadius:12,padding:"12px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:13,color:"#b8aff0",fontWeight:"bold"}}>✦ Outreach Package for {contactName}</span><button onClick={()=>{setResult(null);setError("");}} style={{...btnOS,padding:"5px 12px",fontSize:11}}>← New Message</button></div><div style={{display:"flex",gap:6,marginBottom:18,flexWrap:"wrap"}}>{OUT_TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{background:tab===t.id?G.purple:"#0d1017",color:tab===t.id?"#fff":G.muted,border:`1px solid ${tab===t.id?G.purple:G.border}`,borderRadius:8,padding:"7px 13px",fontSize:11,fontWeight:tab===t.id?700:400,cursor:"pointer"}}>{t.label}</button>)}</div>{tab==="messages"&&<><OCard title="WhatsApp" badge="WhatsApp" content={result.whatsapp}/><OCard title="SMS" badge="160 chars" content={result.sms}/></>}{tab==="voice"&&<><p style={{color:G.muted,fontSize:13,margin:"0 0 12px"}}>Read naturally — don't sound like you're reading a script.</p><OCard title="Phone Call Script" content={result.voice_script}/></>}{tab==="email"&&<><OCard title="Email Subject" content={result.email_subject}/><OCard title="Email Body" content={result.email_body}/></>}{tab==="letter"&&<><p style={{color:G.muted,fontSize:13,margin:"0 0 12px"}}>Replace brackets before printing.</p><OCard title="Formal Letter" content={result.formal_letter}/></>}{tab==="followups"&&<><p style={{color:G.muted,fontSize:13,margin:"0 0 12px"}}>Send in order if no reply.</p><OCard title="Follow-Up #1" badge="Day 3" content={result.followup_1}/><OCard title="Follow-Up #2" badge="Week 1" content={result.followup_2}/><OCard title="Follow-Up #3" badge="Week 2" content={result.followup_3}/><OCard title="Follow-Up #4" badge="Month 1" content={result.followup_4}/></>}{tab==="schedule"&&<><p style={{color:G.muted,fontSize:13,margin:"0 0 16px"}}>Your exact follow-up plan for {contactName}.</p>{result.schedule?.map((d,i)=><div key={i} style={{background:"#0d1017",border:`1px solid ${G.border}`,borderRadius:10,padding:"15px 17px",marginBottom:12}}><div style={{display:"flex",alignItems:"center",gap:9,marginBottom:10}}><span style={{fontSize:20}}>{d.icon}</span><span style={{fontSize:13,fontWeight:700,color:G.purple}}>{d.day}</span></div>{d.tasks?.map((t,j)=><div key={j} style={{display:"flex",gap:9,alignItems:"flex-start",marginBottom:6}}><span style={{color:G.purple,fontWeight:700,flexShrink:0}}>→</span><span style={{fontSize:13,color:"#d1d5db",lineHeight:1.6}}>{t}</span></div>)}</div>)}</>}</div></div>;
return <div style={{minHeight:"100vh",background:G.bg,color:G.text}}><OHdr/><div style={{maxWidth:660,margin:"0 auto",padding:"22px 14px 60px"}}>
<div style={ocard}><h2 style={{margin:"0 0 4px",fontSize:16,fontWeight:700,color:G.text}}>👤 Who Are You Contacting?</h2><p style={{color:G.muted,fontSize:13,margin:"0 0 18px"}}>The more detail, the more personalised the messages.</p><OField label="Their First Name" value={contactName} onChange={setContactName} placeholder="Maria"/><OChips label="Contact Type" opts={OUT_CONTACT_TYPES} sel={contactType} toggle={setContactType} single/><OChips label="Reason for Reaching Out" hint="Why are you contacting them right now?" opts={OUT_REASONS} sel={contactReason} toggle={setContactReason} single/><OChips label="Communication Tone" opts={OUT_TONES} sel={tone} toggle={setTone} single/></div>
{isObjection&&<div style={ocard}><h2 style={{margin:"0 0 4px",fontSize:16,fontWeight:700,color:G.text}}>🛡️ What Objection Did They Raise?</h2><p style={{color:G.muted,fontSize:13,margin:"0 0 16px"}}>Select the category and paste their exact words for a much more powerful response.</p><OChips label="Objection Category" opts={OUT_OBJECTIONS} sel={objection} toggle={setObjection} single/><div style={{marginTop:14}}><label style={{display:"block",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:G.muted,textTransform:"uppercase",marginBottom:4}}>Their Exact Words <span style={{fontSize:10,fontWeight:400,color:"#4b5563"}}>(optional but recommended)</span></label><p style={{fontSize:11,color:"#4b5563",margin:"0 0 6px",fontStyle:"italic"}}>Paste exactly what they said — the AI will respond to their specific words</p><textarea value={exactObjection} onChange={e=>setExactObjection(e.target.value)} placeholder='e.g. "I tried MONAT before and my hair fell out" or "I don\'t believe in MLM"' rows={3} style={{width:"100%",background:"#0d1017",border:`1px solid ${G.border}`,borderRadius:8,color:G.text,fontSize:14,padding:"11px 14px",outline:"none",boxSizing:"border-box",fontFamily:"inherit",resize:"vertical"}}/></div></div>}
<div style={ocard}><h2 style={{margin:"0 0 4px",fontSize:16,fontWeight:700,color:G.text}}>💇 Their Hair & Skin Situation</h2><p style={{color:G.muted,fontSize:13,margin:"0 0 16px"}}>The AI will tailor content around their specific problems.</p><OChips label="Their Hair / Skin Problems" opts={OUT_HAIR} sel={hairProblems} toggle={v=>setHairProblems(prev=>togArr(prev,v))}/><OChips label="Products to Mention" hint="Optional" opts={OUT_PRODUCTS} sel={products} toggle={v=>setProducts(prev=>togArr(prev,v))}/></div>
{isPartner&&<div style={ocard}><h2 style={{margin:"0 0 4px",fontSize:16,fontWeight:700,color:G.text}}>🚀 Why Would They Be a Great Partner?</h2><OChips label="Their Profile" opts={OUT_PARTNER_TARGETS} sel={partnerTargets} toggle={v=>setPartnerTargets(prev=>togArr(prev,v))}/></div>}
<div style={ocard}><h2 style={{margin:"0 0 4px",fontSize:16,fontWeight:700,color:G.text}}>💡 Personal Context</h2><p style={{color:G.muted,fontSize:13,margin:"0 0 16px"}}>Personal details make messages feel real — not copy-paste.</p><OField label="Prior Contact History" hint="Have you spoken before? What did they say?" value={priorContact} onChange={setPriorContact} placeholder='e.g. "Met at a MONAT event 2 weeks ago. Said she was interested but wanted to think about it."' rows={2}/><OField label="Personal Note" hint="Kids, job, lifestyle — anything personal you know" value={personalNote} onChange={setPersonalNote} placeholder='e.g. "Has 2 young kids, recently went back to work, mentioned her hair has been really dry."' rows={2}/></div>
<div style={ocard}><h2 style={{margin:"0 0 4px",fontSize:16,fontWeight:700,color:G.text}}>🏷️ Your Details</h2><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}><OField label="Your Name" value={yourName} onChange={setYourName} placeholder="Maria Johnson"/><OField label="Your WhatsApp / Phone" value={yourPhone} onChange={setYourPhone} placeholder="+1 (555) 000-0000"/></div><OField label="Your MONAT Shop Link" value={yourLink} onChange={setYourLink} placeholder="yourname.mymonat.com"/></div>
{error&&<div style={{background:"#1a0a0a",border:"1px solid #3a1a1a",borderRadius:8,padding:"12px 14px",color:"#f87171",fontSize:13,marginBottom:14}}>⚠ {error}</div>}
{loading&&<div style={{background:G.card,border:`1px solid ${G.border}`,borderRadius:10,padding:"16px 20px",marginBottom:14,textAlign:"center"}}><p style={{color:G.purple,fontSize:14,margin:0,fontWeight:600}}>{loadingMsg}</p><p style={{color:G.muted,fontSize:12,margin:"6px 0 0"}}>Generating in {lang}. Takes about 20 seconds...</p></div>}
<button onClick={()=>canGenerate&&!loading&&generate()} disabled={loading||!canGenerate} style={{...btnOP(!canGenerate||loading),width:"100%",fontSize:15}}>{loading?"Generating...":"✦ Generate Full Outreach Package"}</button>
{!canGenerate&&<p style={{color:G.muted,fontSize:12,marginTop:8,textAlign:"center"}}>Fill in their name, contact type, reason, tone and your name to continue.</p>}
</div></div>;
}

// ── ROOT ──────────────────────────────────────────────────────────────────────
function Root(){
const[user,setUser]=useState(null);
const[checking,setChecking]=useState(true);
const[tool,setTool]=useState(null);
const[lang,setLang]=useState(()=>localStorage.getItem("nt_lang")||"English");

useEffect(()=>{
const s=localStorage.getItem("nt_u");
if(s){try{const u=JSON.parse(s);callAuth({action:"check",userId:u.id}).then(d=>{if(d.success)setUser(d.user);else localStorage.removeItem("nt_u");setChecking(false);}).catch(()=>setChecking(false));}catch{setChecking(false);}}
else setChecking(false);
},[]);

useEffect(()=>{localStorage.setItem("nt_lang",lang);},[lang]);

const logout=()=>{localStorage.removeItem("nt_u");setUser(null);setTool(null);};

if(checking)return<div style={{minHeight:"100vh",background:C.off,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{textAlign:"center"}}><div style={{width:44,height:44,borderRadius:11,background:C.dark,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,color:"#fff",margin:"0 auto 10px"}}>✦</div><div style={{fontSize:12,color:C.gray}}>Loading...</div></div></div>;
if(!user)return<Login onLogin={setUser}/>;
if(tool==="marketing")return<MarketingMachine user={user} lang={lang} onBack={()=>setTool(null)}/>;
if(tool==="outreach")return<OutreachMachine user={user} lang={lang} onBack={()=>setTool(null)}/>;
return<Home user={user} lang={lang} setLang={setLang} setTool={setTool} onLogout={logout}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
