<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Tools by Streamflux</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Georgia', serif; background: #f8f7ff; color: #111; }
input, button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const C = { purple:"#7664d0", dark:"#2e2a4a", light:"#ede9ff", white:"#ffffff", off:"#f8f7ff", gray:"#6b6b6b", gl:"#e8e6f0", gbg:"#f4f3f9", green:"#2d9e6b", glight:"#e6f7f1", red:"#dc2626", redLight:"#fff5f5" };

const callAuth = async (body) => {
const r = await fetch("/api/auth", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
return r.json();
};

function Login({ onLogin }) {
const [em, setEm] = useState("");
const [pw, setPw] = useState("");
const [loading, setL] = useState(false);
const [err, setErr] = useState("");
const go = async () => {
if (!em || !pw) { setErr("Please enter email and password."); return; }
setL(true); setErr("");
const d = await callAuth({ action:"login", email:em, password:pw });
setL(false);
if (d.success) { localStorage.setItem("nt_u", JSON.stringify(d.user)); onLogin(d.user); }
else setErr(d.error || "Invalid credentials.");
};
const inp = { width:"100%", padding:"11px 13px", borderRadius:9, boxSizing:"border-box", background:C.gbg, border:`1.5px solid ${C.gl}`, fontSize:14, outline:"none", color:"#111", fontFamily:"inherit" };
return (
<div style={{ minHeight:"100vh", background:C.off, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
<div style={{ width:"100%", maxWidth:400 }}>
<div style={{ textAlign:"center", marginBottom:24 }}>
<div style={{ width:52, height:52, borderRadius:13, background:C.dark, display:"flex", alignItems:"center", justifyContent:"center", fontSize:24, color:"#fff", margin:"0 auto 12px" }}>✦</div>
<div style={{ fontSize:20, fontWeight:"bold", letterSpacing:2 }}>Network Tools</div>
<div style={{ fontSize:12, color:C.gray, marginTop:2 }}>by Streamflux</div>
</div>
<div style={{ background:C.white, border:`1px solid ${C.gl}`, borderRadius:16, padding:"26px 22px" }}>
<h2 style={{ fontSize:17, fontWeight:700, textAlign:"center", marginBottom:4 }}>Welcome back</h2>
<p style={{ fontSize:13, color:C.gray, textAlign:"center", marginBottom:20 }}>Sign in to your account</p>
<label style={{ fontSize:10, color:C.gray, display:"block", marginBottom:4, fontWeight:700, textTransform:"uppercase" }}>Email</label>
<input type="email" value={em} onChange={e=>setEm(e.target.value)} placeholder="your@email.com" onKeyDown={e=>e.key==="Enter"&&go()} style={{...inp, marginBottom:12}} onFocus={e=>e.target.style.borderColor=C.purple} onBlur={e=>e.target.style.borderColor=C.gl}/>
<label style={{ fontSize:10, color:C.gray, display:"block", marginBottom:4, fontWeight:700, textTransform:"uppercase" }}>Password</label>
<input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&go()} style={{...inp, marginBottom:16}} onFocus={e=>e.target.style.borderColor=C.purple} onBlur={e=>e.target.style.borderColor=C.gl}/>
{err && <div style={{ background:C.redLight, border:"1px solid #fecaca", borderRadius:8, padding:"9px 12px", marginBottom:12, color:C.red, fontSize:13 }}>⚠️ {err}</div>}
<button onClick={go} disabled={loading} style={{ width:"100%", padding:"13px", borderRadius:10, border:"none", background:loading?C.gl:C.dark, color:loading?C.gray:"#fff", fontSize:14, fontWeight:700, cursor:loading?"not-allowed":"pointer" }}>
{loading ? "Signing in..." : "Sign In →"}
</button>
<p style={{ fontSize:11, color:C.gray, textAlign:"center", marginTop:14 }}>Need help? <span style={{ color:C.purple }}>support@streamflux.app</span></p>
</div>
</div>
</div>
);
}

function Home({ user, onLogout }) {
// Load saved language
const [homeLang, setHomeLang] = useState(() => localStorage.getItem("nt_lang") || "English");
const saveLang = (l) => { setHomeLang(l); localStorage.setItem("nt_lang", l); };

const HOME_LANGS = [
{value:"English",label:"🇺🇸 English"},
{value:"Spanish",label:"🇪🇸 Español (España)"},
{value:"Mexican",label:"🇲🇽 Español (México)"},
{value:"Italian",label:"🇮🇹 Italiano"},
{value:"French",label:"🇫🇷 Français"},
{value:"Portuguese",label:"🇧🇷 Português"},
{value:"German",label:"🇩🇪 Deutsch"},
{value:"Arabic",label:"🇦🇪 العربية"},
{value:"Chinese",label:"🇨🇳 中文"},
];

const tools = [
{
href: `/marketing.html?lang=${homeLang}`,
icon: "📣",
title: "Marketing Machine",
desc: "Create content for WhatsApp, Instagram, Facebook, TikTok Shop and more. Generate a full posting package in seconds.",
tags: ["WhatsApp Status", "Instagram Feed", "Instagram Shop", "Instagram Reel", "Facebook Feed", "Facebook Shop", "TikTok Shop", "Image / Canva", "7-Day Schedule"],
color: C.dark,
},
{
href: `/outreach.html?lang=${homeLang}`,
icon: "🤝",
title: "Outreach Machine",
desc: "Create personalised 1-on-1 messages for any contact. Follow-ups, objection handling, voice scripts and formal letters.",
tags: ["WhatsApp Message", "SMS", "Phone Script", "Email", "Formal Letter", "4 Follow-Ups", "Follow-Up Schedule"],
color: "#1a1a3a",
},
];

return (
<div style={{ minHeight:"100vh", background:C.off }}>
<header style={{ background:C.white, borderBottom:`1px solid ${C.gl}`, padding:"0 20px", height:56, display:"flex", alignItems:"center", justifyContent:"space-between", boxShadow:"0 1px 6px rgba(46,42,74,0.07)", position:"sticky", top:0, zIndex:50 }}>
<div style={{ display:"flex", alignItems:"center", gap:10 }}>
<div style={{ width:32, height:32, borderRadius:8, background:C.dark, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontSize:14 }}>✦</div>
<div>
<div style={{ fontSize:13, fontWeight:"bold", letterSpacing:2, lineHeight:1.1 }}>Network Tools</div>
<div style={{ fontSize:8, color:C.purple, letterSpacing:2, textTransform:"uppercase" }}>by Streamflux</div>
</div>
</div>
<div style={{ display:"flex", alignItems:"center", gap:10 }}>
{user.trialActive && <span style={{ fontSize:10, color:C.purple, background:C.light, borderRadius:10, padding:"3px 8px" }}>⏰ {user.daysLeft}d left</span>}
<span style={{ fontSize:12, color:C.gray }}>{user.name}</span>
<button onClick={onLogout} style={{ background:C.white, color:C.dark, border:`1px solid ${C.gl}`, borderRadius:8, padding:"5px 12px", fontSize:11, cursor:"pointer" }}>Log Out</button>
</div>
</header>

<div style={{ maxWidth:680, margin:"0 auto", padding:"36px 16px 60px" }}>
<div style={{ textAlign:"center", marginBottom:36 }}>
<div style={{ fontSize:28, marginBottom:8 }}>✦</div>
<h1 style={{ fontSize:22, fontWeight:700, letterSpacing:1, marginBottom:8 }}>Welcome, {user.name.split(" ")[0]}!</h1>
<p style={{ fontSize:14, color:C.gray }}>Choose a tool to get started.</p>
<div style={{ marginTop:16, display:"flex", alignItems:"center", justifyContent:"center", gap:10 }}>
<span style={{ fontSize:12, color:C.gray }}>Language:</span>
<select value={homeLang} onChange={e=>saveLang(e.target.value)} style={{ padding:"6px 12px", borderRadius:16, border:`1px solid ${C.gl}`, background:C.white, color:C.dark, fontSize:13, cursor:"pointer", outline:"none" }}>
{HOME_LANGS.map(l=><option key={l.value} value={l.value}>{l.label}</option>)}
</select>
</div>
</div>

<div style={{ display:"flex", flexDirection:"column", gap:16 }}>
{tools.map(tool => (
<a key={tool.href} href={tool.href} style={{ textDecoration:"none" }}>
<div style={{ background:tool.color, borderRadius:16, padding:"26px 24px", cursor:"pointer", transition:"transform 0.15s", boxShadow:"0 4px 20px rgba(46,42,74,0.15)" }}
onMouseEnter={e=>e.currentTarget.style.transform="translateY(-2px)"}
onMouseLeave={e=>e.currentTarget.style.transform="translateY(0)"}>
<div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:10 }}>
<span style={{ fontSize:28 }}>{tool.icon}</span>
<div>
<div style={{ fontSize:18, fontWeight:700, color:"#fff", letterSpacing:0.5 }}>{tool.title}</div>
<div style={{ fontSize:8, color:"rgba(255,255,255,0.5)", letterSpacing:2, textTransform:"uppercase" }}>by Streamflux</div>
</div>
<div style={{ marginLeft:"auto", color:"rgba(255,255,255,0.6)", fontSize:20 }}>→</div>
</div>
<p style={{ fontSize:13, color:"rgba(255,255,255,0.75)", lineHeight:1.6, marginBottom:14 }}>{tool.desc}</p>
<div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
{tool.tags.map(tag => (
<span key={tag} style={{ fontSize:10, background:"rgba(255,255,255,0.1)", color:"rgba(255,255,255,0.7)", borderRadius:10, padding:"3px 9px" }}>{tag}</span>
))}
</div>
</div>
</a>
))}
</div>

<div style={{ marginTop:40, textAlign:"center" }}>
<div style={{ fontSize:9, letterSpacing:2, color:C.gl, textTransform:"uppercase" }}>Network Tools by Streamflux</div>
<div style={{ fontSize:9, color:C.gl, marginTop:3 }}>Powered by Claude AI · streamflux.app</div>
</div>
</div>
</div>
);
}

function Root() {
const [user, setUser] = useState(null);
const [checking, setChecking] = useState(true);

useEffect(() => {
const s = localStorage.getItem("nt_u");
if (s) {
try {
const u = JSON.parse(s);
callAuth({ action:"check", userId:u.id }).then(d => {
if (d.success) setUser(d.user);
else localStorage.removeItem("nt_u");
setChecking(false);
}).catch(() => setChecking(false));
} catch { setChecking(false); }
} else setChecking(false);
}, []);

const logout = () => { localStorage.removeItem("nt_u"); setUser(null); };

if (checking) return (
<div style={{ minHeight:"100vh", background:C.off, display:"flex", alignItems:"center", justifyContent:"center" }}>
<div style={{ textAlign:"center" }}>
<div style={{ width:44, height:44, borderRadius:11, background:C.dark, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, color:"#fff", margin:"0 auto 10px" }}>✦</div>
<div style={{ fontSize:12, color:C.gray }}>Loading...</div>
</div>
</div>
);

if (!user) return <Login onLogin={setUser} />;
return <Home user={user} onLogout={logout} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
